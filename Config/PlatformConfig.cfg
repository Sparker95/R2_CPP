-ChassisInterface
SerialDevPath /dev/ttyAMA3
MotorControllerKP 0.02
MotorControllerKI 0.5
MotorControllerKD 0.0
MotorControllerErrorScale 0.01
MotorControllerErrorIntegralMax 1.0
MotorControllerAccelMove 150.0
# Now it is set for emerg. brake
MotorControllerAccelBrake 900.0
SteerSpeed 32.0

-ChassisControl
# Warning - 0.67 is max, more may harm steering mechanism
SteerOutputMax 0.67
SpeedSlow_m/s 0.2
SpeedCruise_m/s 0.4
SpeedFast_m/s 0.7

-SensorInterface
SerialDevPath /dev/serial0
MotorSpeed_Hz 8.0
MotorControllerKP 1.0
MotorControllerKI 4.0
MotorControllerKD 0.0
MotorControllerErrorScale 0.1
MotorControllerErrorIntegralMax 0.35
MotorControllerStartPwmValue_01 0.4
MotorControllerMinPwmValue_01 0.15